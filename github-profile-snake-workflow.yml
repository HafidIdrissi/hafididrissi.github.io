# Mirror of HafidIdrissi/HafidIdrissi → .github/workflows/snake.yml
# Generates the contribution-graph snake and pushes the SVGs to the `output` branch.
# The README consumes them from:
#   https://raw.githubusercontent.com/HafidIdrissi/HafidIdrissi/output/github-snake-dark.svg

name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23F97316&color_dots=%23EBEDF0,%23C7D2FE,%23818CF8,%234F46E5,%23F97316
            dist/github-snake-dark.svg?color_snake=%23F97316&color_dots=%23161B22,%23312E81,%234F46E5,%23818CF8,%23F97316
            dist/ocean.gif?color_snake=%23F97316&color_dots=%23161B22,%23312E81,%234F46E5,%23818CF8,%23F97316

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
