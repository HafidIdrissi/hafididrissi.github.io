<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 8" width="900" height="8">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F97316" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#F97316" stop-opacity="0.75"/>
      <stop offset="50%"  stop-color="#6366F1" stop-opacity="0.75"/>
      <stop offset="80%"  stop-color="#22C55E" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .sweep { animation: sweep 4.5s ease-in-out infinite; }
    .pulse { animation: pulse 4.5s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-240px); }
      100% { transform: translateX(900px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
  </style>

  <rect class="pulse" x="0" y="3" width="900" height="2" rx="1" fill="url(#base)"/>
  <rect class="sweep" x="0" y="2" width="240" height="4" rx="2" fill="url(#shine)" opacity="0.5"/>
</svg>
