<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title">
      <title id="title">Hafid Idrissi. Full-stack and cloud engineer. Hager, Mirion and JUNIA.</title><style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#202b27}
      .muted{fill:#59635b}.accent{fill:#b84628}.line{stroke:#d9ddd3;fill:none}
      .panel{fill:#ecefe7;stroke:#d9ddd3}.paper{fill:#f6f5f0;stroke:#d9ddd3}
